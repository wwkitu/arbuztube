<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArbuzTube</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f0f0f;
  color:white;
  transition:0.25s;
}

button{
  cursor:pointer;
}

/* LIGHT THEME */

body.light-theme{
  background:#f2f2f2;
  color:#111;
}

body.light-theme header{
  background:white;
  border-bottom:1px solid #ddd;
}

body.light-theme .header-btn,
body.light-theme .action-btn,
body.light-theme .back-btn,
body.light-theme .setting-select{
  background:#e2e2e2;
  color:#111;
}

body.light-theme .video-title{
  color:#111;
}

body.light-theme .setting-item{
  background:white;
}

body.light-theme .search-input{
  background:white;
  color:#111;
}

/* HEADER */

header{
  width:100%;
  height:52px;
  background:#181818;
  position:fixed;
  top:0;
  left:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #2d2d2d;
  z-index:1000;
}

/* LOGO */

.logo img{
  height:26px;
}

/* RIGHT */

.header-buttons{
  display:flex;
  align-items:center;
  gap:8px;
}

/* BUTTONS */

.header-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:10px;
  background:#272727;
  color:white;
  font-size:15px;
  transition:0.2s;
}

.header-btn:hover{
  background:#3a3a3a;
}

/* PROFILE */

.profile-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  overflow:hidden;
  background:none;
}

.profile-btn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CONTENT */

.content{
  padding:68px 12px 20px;
  max-width:1100px;
  margin:auto;
}

/* GRID */

.videos{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap:16px;
}

/* CARD */

.video-card{
  cursor:pointer;
  transition:0.25s;
}

.video-card:hover{
  transform:scale(1.02);
}

/* THUMB */

.thumbnail{
  width:100%;
  aspect-ratio:9/16;
  border-radius:14px;
  background-size:cover;
  background-position:center;
  background-color:#222;
}

/* TITLE */

.video-info{
  padding-top:8px;
}

.video-title{
  font-size:13px;
  font-weight:bold;
  line-height:1.35;
}

/* PAGE */

.page{
  display:none;
}

/* PLAYER */

.video-player video{
  width:100%;
  max-height:78vh;
  border-radius:16px;
  background:black;
}

/* DETAILS */

.video-details{
  margin-top:16px;
}

.video-details h1{
  font-size:18px;
  margin-bottom:14px;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:10px;
}

.action-btn{
  background:#272727;
  border:none;
  color:white;
  padding:8px 16px;
  border-radius:30px;
  font-size:14px;
  transition:0.2s;
}

.action-btn.active-like{
  background:#4caf50;
}

.action-btn.active-dislike{
  background:#c62828;
}

/* BACK */

.back-btn{
  margin-bottom:16px;
  background:#272727;
  color:white;
  border:none;
  padding:8px 16px;
  border-radius:30px;
  font-size:14px;
}

/* SETTINGS */

.settings-box{
  display:flex;
  flex-direction:column;
  gap:15px;
  max-width:450px;
}

.setting-item{
  background:#1d1d1d;
  padding:15px;
  border-radius:14px;
}

.setting-item h3{
  margin-bottom:12px;
}

/* SELECT */

.setting-select{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#272727;
  color:white;
  outline:none;
}

/* PROFILE */

.profile-page{
  text-align:center;
}

.profile-avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  margin:auto;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  margin-top:15px;
  font-size:24px;
  font-weight:bold;
}

/* SEARCH */

.search-box{
  margin-bottom:20px;
}

.search-input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#1d1d1d;
  color:white;
  font-size:15px;
  outline:none;
}

/* MOBILE */

@media(max-width:600px){

  .videos{
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  }

  .video-details h1{
    font-size:16px;
  }

  .logo img{
    height:22px;
  }
}

</style>
</head>
<body>

<header>

  <div class="logo">

    <img
      id="logoImg"
      src="arbuztube_logo_white.png"
      alt="ArbuzTube"
      onclick="showHome()"
      style="cursor:pointer;"
    >

  </div>

  <div class="header-buttons">

    <button
      class="header-btn"
      onclick="openSearchPage()"
    >
      🔍
    </button>

    <button
      class="header-btn"
      onclick="openSettings()"
    >
      ⚙
    </button>

    <button
      class="profile-btn"
      onclick="openProfile()"
    >

      <img src="avatar.png">

    </button>

  </div>

</header>

<main class="content">

<section id="homePage">

  <div
    class="videos"
    id="videosContainer"
  ></div>

</section>

<section
  id="videoPage"
  class="page"
>

  <button
    class="back-btn"
    onclick="showHome()"
  >
    ← Назад
  </button>

  <div class="video-player">

    <video
      id="videoPlayer"
      controls
    ></video>

  </div>

  <div class="video-details">

    <h1 id="videoTitle">
      Название
    </h1>

    <div class="actions">

      <button
        class="action-btn"
        id="likeBtn"
        onclick="toggleLike()"
      >
        👍 Лайк
      </button>

      <button
        class="action-btn"
        id="dislikeBtn"
        onclick="toggleDislike()"
      >
        👎 Дизлайк
      </button>

    </div>

  </div>

</section>

<section
  id="searchPage"
  class="page"
>

  <button
    class="back-btn"
    onclick="showHome()"
  >
    ← Назад
  </button>

  <div class="search-box">

    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="Поиск видео..."
      onkeyup="searchVideos()"
    >

  </div>

  <div
    class="videos"
    id="searchResults"
  ></div>

</section>

<section
  id="settingsPage"
  class="page"
>

  <button
    class="back-btn"
    onclick="showHome()"
  >
    ← Назад
  </button>

  <div class="settings-box">

    <div class="setting-item">

      <h3>Тема</h3>

      <button
        class="action-btn"
        onclick="toggleTheme()"
      >
        Сменить тему
      </button>

    </div>

    <div class="setting-item">

      <h3>Автовоспроизведение</h3>

      <button
        class="action-btn"
        id="autoplayBtn"
        onclick="toggleAutoplay(this)"
      >
        Включено
      </button>

    </div>

    <div class="setting-item">

      <h3>Громкость по умолчанию</h3>

      <select
        class="setting-select"
        onchange="changeVolume(this)"
      >

        <option value="1">
          100%
        </option>

        <option value="0.75">
          75%
        </option>

        <option value="0.5">
          50%
        </option>

        <option value="0.25">
          25%
        </option>

        <option value="0">
          Без звука
        </option>

      </select>

    </div>

    <div class="setting-item">

      <h3>Скорость видео</h3>

      <select
        class="setting-select"
        onchange="changeSpeed(this)"
      >

        <option value="1">
          1x
        </option>

        <option value="1.25">
          1.25x
        </option>

        <option value="1.5">
          1.5x
        </option>

        <option value="2">
          2x
        </option>

      </select>

    </div>

    <div class="setting-item">

      <h3>Качество обложек</h3>

      <select
        class="setting-select"
        onchange="changeThumbnailQuality(this)"
      >

        <option>
          Высокое
        </option>

        <option>
          Среднее
        </option>

        <option>
          Низкое
        </option>

      </select>

    </div>

    <div class="setting-item">

      <h3>Версия</h3>

      <p>
        1.0 release [часть 1]
      </p>

    </div>

  </div>

</section>

<section
  id="profilePage"
  class="page profile-page"
>

  <button
    class="back-btn"
    onclick="showHome()"
  >
    ← Назад
  </button>

  <div class="profile-avatar">

    <img src="avatar.png">

  </div>

  <div class="profile-name">
    arbuzova
  </div>

</section>

</main>

<script>

// ===================
// VIDEOS (Изменено: теперь здесь хранятся реальные названия видео строк)
// ===================

const videos = [
  { id:1, video:"video1.mp4", title:"Подруга с мотором #танцы #dance", thumb:"video1.png" },
  { id:2, video:"video2.mp4", title:"Лада Приора #танцы #dance #лада #приора", thumb:"video2.png" },
  { id:3, video:"video3.mp4", title:"Отсчёт #тренд #trend", thumb:"video3.png" },
  { id:4, video:"video4.mp4", title:"Какой ты грубиян #липсинг #lipsing", thumb:"video4.png" },
  { id:5, video:"video5.mp4", title:"Я тебе поставлю лайк #липсинг #lipsing", thumb:"video5.png" },
  { id:6, video:"video6.mp4", title:"Танцует Макарена #танцы #dance", thumb:"video6.png" },
  { id:7, video:"video7.mp4", title:"Шпионка #скрепишы #подарок #деньрождения", thumb:"video7.png" },
  { id:8, video:"video8.mp4", title:"Суша #суши #sushi", thumb:"video8.png" },
  { id:9, video:"video9.mp4", title:"Макарена липсинг #Макарена #липсинг #lipsing", thumb:"video9.png" },
  { id:10, video:"video10.mp4", title:"Оцениваете #кот #cat", thumb:"video10.png" },
  { id:11, video:"video11.mp4", title:"Танцы под чем то¿ #танцы #dance", thumb:"video11.png" },
  { id:12, video:"video12.mp4", title:"ЭЭЭЙ МАКАРЕНА #Макарена #танец #dance", thumb:"video12.png" },
  { id:13, video:"video13.mp4", title:"Я че упоротый #пипец", thumb:"video13.png" },
  { id:14, video:"video14.mp4", title:"Небо голубое #тренд #trend", thumb:"video14.png" },
  { id:15, video:"video15.mp4", title:"Обзор на зубы, точнее на из отсутствие. И на компутер брата #влог #vlog", thumb:"video15.png" },
  { id:16, video:"video16.mp4", title:"Звонит смерть в нищите #дозвон", thumb:"video16.png" },
  { id:17, video:"video17.mp4", title:"Не верьте этой надписи #крутая", thumb:"video17.png" },
  { id:18, video:"video18.mp4", title:"МистерДашаЮтуб на тусе #туса #танец #dance", thumb:"video18.png" },
  { id:19, video:"video19.mp4", title:"Даша ест хантавирус #еда #food #asmr", thumb:"video19.png" },
  { id:20, video:"video20.mp4", title:"Дэнс под песню #танец #dance #тренд #trend", thumb:"video20.png" },
  { id:21, video:"video21.mp4", title:"Уф уф уф под кайфом #кайфуем", thumb:"video21.png" },
  { id:22, video:"video22.mp4", title:"Ра ра ра #крутооотипо", thumb:"video22.png" },
  { id:23, video:"video23.mp4", title:"Пу ру пу пу ру ру пу #танец #dance", thumb:"video23.png" },
  { id:24, video:"video24.mp4", title:"Эдит Мистера Даши под песни Билли Алиша #edit", thumb:"video24.png" },
  { id:25, video:"video25.mp4", title:"Я трактор выгоняю #танцы #dance", thumb:"video25.png" },
  { id:26, video:"video26.mp4", title:"Кукуджамба #чзх", thumb:"video26.png" }
];

// ===================
// SETTINGS
// ===================

let autoplayEnabled = true;
let defaultVolume = 1;
let defaultSpeed = 1;

// ===================
// SCROLL STATE & PAGE TRACKING
// ===================

let scrollPositions = {};
let currentPage = 'homePage';

// ===================
// VIDEO STATES
// ===================

const videoRatings = {};
let currentVideoId = null;

// ===================
// LOAD VIDEOS (Оптимизировано: убран fetch)
// ===================

function loadVideos(){
  const container = document.getElementById('videosContainer');
  container.innerHTML = '';

  for(const item of videos){
    createVideoCard(container, item, item.title);
  }
}

// ===================
// CREATE CARD
// ===================

function createVideoCard(parent, item, title){
  const card = document.createElement('div');
  card.className = 'video-card';

  card.innerHTML = `
    <div
      class="thumbnail"
      style="background-image: url('${item.thumb}')"
    ></div>
    <div class="video-info">
      <div class="video-title">
        ${title}
      </div>
    </div>
  `;

  card.onclick = () => {
    openVideo(item.id, item.video, title);
  };

  parent.appendChild(card);
}

// ===================
// HIDE PAGES
// ===================

function hideAllPages(){
  scrollPositions[currentPage] = window.scrollY;

  document.getElementById('homePage').style.display = 'none';
  document.getElementById('videoPage').style.display = 'none';
  document.getElementById('searchPage').style.display = 'none';
  document.getElementById('settingsPage').style.display = 'none';
  document.getElementById('profilePage').style.display = 'none';
}

// ===================
// HOME
// ===================

function showHome(){
  hideAllPages();
  currentPage = 'homePage';

  document.getElementById('homePage').style.display = 'block';
  document.getElementById('videoPlayer').pause();
  
  setTimeout(() => {
    window.scrollTo(0, scrollPositions['homePage'] || 0);
  }, 0);
}

// ===================
// VIDEO
// ===================

function openVideo(id, src, title){
  currentVideoId = id;

  hideAllPages();
  currentPage = 'videoPage';

  document.getElementById('videoPage').style.display = 'block';

  setTimeout(() => {
    window.scrollTo(0, 0);
  }, 0);

  document.getElementById('videoTitle').innerText = title;

  const player = document.getElementById('videoPlayer');
  player.src = src;
  player.volume = defaultVolume;
  player.playbackRate = defaultSpeed;
  player.autoplay = autoplayEnabled;
  player.play();

  updateRatingButtons();
}

// ===================
// AUTOPLAY
// ===================

function toggleAutoplay(button){
  autoplayEnabled = !autoplayEnabled;
  button.innerText = autoplayEnabled ? 'Включено' : 'Выключено';
  document.getElementById('videoPlayer').autoplay = autoplayEnabled;
}

// ===================
// VOLUME
// ===================

function changeVolume(select){
  defaultVolume = parseFloat(select.value);
  document.getElementById('videoPlayer').volume = defaultVolume;
}

// ===================
// SPEED
// ===================

function changeSpeed(select){
  defaultSpeed = parseFloat(select.value);
  document.getElementById('videoPlayer').playbackRate = defaultSpeed;
}

// ===================
// THUMB QUALITY
// ===================

function changeThumbnailQuality(select){
  const thumbs = document.querySelectorAll('.thumbnail');

  if(select.value === 'Низкое'){
    thumbs.forEach(thumb => { thumb.style.filter = 'blur(1px)'; });
  } else if(select.value === 'Среднее'){
    thumbs.forEach(thumb => { thumb.style.filter = 'blur(0.5px)'; });
  } else {
    thumbs.forEach(thumb => { thumb.style.filter = 'none'; });
  }
}

// ===================
// LIKE
// ===================

function toggleLike(){
  if(videoRatings[currentVideoId] === 'like'){
    videoRatings[currentVideoId] = null;
  } else {
    videoRatings[currentVideoId] = 'like';
  }
  updateRatingButtons();
}

// ===================
// DISLIKE
// ===================

function toggleDislike(){
  if(videoRatings[currentVideoId] === 'dislike'){
    videoRatings[currentVideoId] = null;
  } else {
    videoRatings[currentVideoId] = 'dislike';
  }
  updateRatingButtons();
}

// ===================
// UPDATE BUTTONS
// ===================

function updateRatingButtons(){
  const likeBtn = document.getElementById('likeBtn');
  const dislikeBtn = document.getElementById('dislikeBtn');

  likeBtn.classList.remove('active-like');
  dislikeBtn.classList.remove('active-dislike');

  if(videoRatings[currentVideoId] === 'like'){
    likeBtn.classList.add('active-like');
  }
  if(videoRatings[currentVideoId] === 'dislike'){
    dislikeBtn.classList.add('active-dislike');
  }
}

// ===================
// SEARCH (Оптимизировано: убран fetch)
// ===================

function openSearchPage(){
  hideAllPages();
  currentPage = 'searchPage';

  document.getElementById('searchPage').style.display = 'block';

  setTimeout(() => {
    window.scrollTo(0, scrollPositions['searchPage'] || 0);
  }, 0);
}

function searchVideos(){
  const query = document.getElementById('searchInput').value.toLowerCase();
  const results = document.getElementById('searchResults');
  results.innerHTML = '';

  for(const item of videos){
    if(item.title.toLowerCase().includes(query)){
      createVideoCard(results, item, item.title);
    }
  }
}

// ===================
// SETTINGS PAGE
// ===================

function openSettings(){
  hideAllPages();
  currentPage = 'settingsPage';

  document.getElementById('settingsPage').style.display = 'block';
  
  setTimeout(() => {
    window.scrollTo(0, 0);
  }, 0);
}

// ===================
// THEME
// ===================

function toggleTheme(){
  const isLight = document.body.classList.toggle('light-theme');
  const logo = document.getElementById('logoImg');
  
  if (isLight) {
    logo.src = 'arbuztube_logo_black.png';
  } else {
    logo.src = 'arbuztube_logo_white.png';
  }
}

// ===================
// PROFILE
// ===================

function openProfile(){
  hideAllPages();
  currentPage = 'profilePage';

  document.getElementById('profilePage').style.display = 'block';
  
  setTimeout(() => {
    window.scrollTo(0, 0);
  }, 0);
}

// ===================
// START
// ===================

loadVideos();

</script>

</body>
</html>
